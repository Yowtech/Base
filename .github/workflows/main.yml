name: Publish Yowtech

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "Type exactly yowtech@<version>-rv from cv/package.json to publish"
        required: true
        type: string

jobs:
  publish:
    name: Publish to npm
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: cv

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Verify package identity, release version, and confirmation
        id: package
        env:
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          if (pkg.name !== 'yowtech' || !/^\d+\.\d+\.\d+-rv$/.test(pkg.version)) {
            throw new Error(`Unexpected release target: ${pkg.name}@${pkg.version}`)
          }
          const packageSpec = `${pkg.name}@${pkg.version}`
          if (process.env.CONFIRM_PUBLISH !== packageSpec) {
            throw new Error(`Confirmation must exactly match ${packageSpec}`)
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `package_name=${pkg.name}\npackage_version=${pkg.version}\npackage_spec=${packageSpec}\n`)
          console.log(`Validated ${packageSpec}`)
          NODE

      - name: Install dependencies
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Check package contents
        run: npm pack --dry-run

      - name: Ensure version is not already published
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.package_version }}
        run: |
          set -euo pipefail
          registry_url="https://registry.npmjs.org/${PACKAGE_NAME}/${PACKAGE_VERSION}"
          http_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$registry_url")"
          case "$http_status" in
            200)
              echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists on npm; refusing to publish." >&2
              exit 1
              ;;
            404)
              echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is not published yet."
              ;;
            *)
              echo "Unexpected npm registry status: HTTP ${http_status}" >&2
              exit 1
              ;;
          esac

      - name: Publish package
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
